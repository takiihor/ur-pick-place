[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ur-pick-place"
version = "0.1.0"
description = "Standalone force-guided Universal Robots pick/place with RG2 and Arduino grippers"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
robot = ["ur-rtde>=1.5.0"]
arduino = ["pyserial>=3.5"]
hardware = ["ur-rtde>=1.5.0", "pyserial>=3.5"]

[project.scripts]
ur-pick-place = "ur_pick_place.cli:main"
arduino-gripper = "ur_pick_place.grippers.arduino_driver:main"

[tool.setuptools.packages.find]
where = ["src"]
