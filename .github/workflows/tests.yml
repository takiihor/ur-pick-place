name: tests
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: bash -n start.sh
      - run: ur-pick-place --config examples/rg2.json --dry-run
  vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[vision]'
      # ArUco, fake RTDE, grasp teaching and preview/execute simulations. ChArUco
      # integration is also tested locally with the sibling generator/detector.
      - run: python -m unittest discover -s tests -p 'test_vision*.py' -v
      - run: python -m unittest discover -s tests -p 'test_marker_teaching.py' -v
